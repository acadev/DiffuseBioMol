name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        env:
          DBM_CORPUS: examples/smoke-corpus
      - run: python -m pip check
      - run: diffusebiomol-prepare --help
      - run: diffusebiomol-train --help
      - run: python -m diffusebiomol.train examples/smoke-corpus runs/ci --epochs 3
